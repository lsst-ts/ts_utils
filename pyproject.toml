[build-system]
requires = [ "setuptools", "setuptools_scm" ]
build-backend = "setuptools.build_meta"

[project]
name = "ts_utils"
description = "Python utilities used by ts_salobj and other Vera C. Rubin Telescope and Site software."
license = { text = "GPL" }
classifiers = [ "Programming Language :: Python :: 3" ]
urls = { documentation = "https://ts-utils.lsst.io", repository = "https://github.com/lsst-ts/ts_utils" }
dynamic = [ "version" ]
dependencies = [
    "aiohttp>=3.14.3",
    "astropy>=8.0.1",
]

[project.scripts]
image-name-service = "lsst.ts.utils.image_name_service_cli:main"

[tool.setuptools.dynamic]
version = { attr = "setuptools_scm.get_version" }

[tool.setuptools.packages.find]
where = [ "python" ]

[tool.setuptools_scm]
write_to = "python/lsst/ts/utils/version.py"
write_to_template = """
# Generated by setuptools_scm
__all__ = ["__version__"]
__version__ = "{version}"
"""

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.optional-dependencies]
dev = ["documenteer[pipelines]"]
